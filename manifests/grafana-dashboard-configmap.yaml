apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  cluster-overview.json: |
    {
      "title": "Cluster Overview",
      "tags": ["cluster"],
      "timezone": "browser",
      "schemaVersion": 16,
      "panels": [
        {"id": 1, "title": "CPU Usage", "type": "graph", "targets": [{"expr": "100 - (avg by (instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"}]},
        {"id": 2, "title": "Memory Usage", "type": "graph", "targets": [{"expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100"}]},
        {"id": 3, "title": "Disk Usage", "type": "graph", "targets": [{"expr": "100 - ((node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes)"}]},
        {"id": 4, "title": "Pod Status", "type": "graph", "targets": [{"expr": "kube_pod_status_phase{phase=\"Running\"}"}]},
        {"id": 5, "title": "Network IO", "type": "graph", "targets": [{"expr": "rate(node_network_receive_bytes_total[5m])"}]}
      ]
    }
